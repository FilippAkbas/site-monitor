name: 🔍 Site Monitor

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes
  workflow_dispatch:           # Allow manual run from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .monitor-state
          key: monitor-state-v1-${{ github.run_id }}
          restore-keys: |
            monitor-state-v1-

      - name: Run checks
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
          SITES_LIST:  ${{ secrets.SITES_LIST }}
        run: bash monitor.sh

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .monitor-state
          key: monitor-state-v1-${{ github.run_id }}
